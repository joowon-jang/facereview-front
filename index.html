<!doctype html>
<html lang="ko-KR" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png?v=2" />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/android-chrome-512x512.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15151d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="FaceReview - 영상을 보며 느끼는 감정을 분석하고 공유하세요. 내 표정으로 리뷰하는 새로운 영상 경험." />
    <meta
      name="keywords"
      content="FaceReview, 페이스리뷰, 감정 리뷰, 영상 리뷰, 표정 분석, 감정 분석, 얼굴 표정, 영상 추천, 감정 기반 추천, 리액션 영상, 유튜브 리뷰, 영상 플랫폼, emotion review, face emotion" />
    <meta name="author" content="FaceReview" />
    <link rel="canonical" href="https://www.facereview.net" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FaceReview" />
    <meta property="og:title" content="FaceReview - 감정 리뷰 영상 플랫폼" />
    <meta
      property="og:description"
      content="영상을 보며 느끼는 감정을 분석하고 공유하세요. 내 표정으로 리뷰하는 새로운 영상 경험." />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://www.facereview.net" />
    <meta property="og:image" content="https://www.facereview.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FaceReview 대표 이미지" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FaceReview - 감정 리뷰 영상 플랫폼" />
    <meta
      name="twitter:description"
      content="영상을 보며 느끼는 감정을 분석하고 공유하세요." />
    <meta name="twitter:image" content="https://www.facereview.net/og-image.png" />

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://facereview-api.winterholic.net" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Async font loading (non-render-blocking) -->
    <link
      rel="preload"
      as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css"
      media="print"
      onload="this.media = 'all'" />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    </noscript>

    <title>FaceReview - 감정 리뷰 영상 플랫폼</title>

    <!-- Structured data (WebSite + sitelinks search) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FaceReview",
        "alternateName": "페이스리뷰",
        "url": "https://www.facereview.net",
        "description": "영상을 보며 느끼는 감정을 분석하고 공유하는 감정 리뷰 영상 플랫폼",
        "inLanguage": "ko-KR",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.facereview.net/main?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <noscript>이 서비스를 이용하려면 JavaScript를 활성화해야 합니다.</noscript>
    <div id="root"></div>
    <div id="loading-start" aria-hidden="true"></div>
    <div id="loading-end" aria-hidden="true"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
